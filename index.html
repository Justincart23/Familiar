<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Familiar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  /* Warm off-white palette — not cold iOS grey */
  --bg:       #F7F6F3;
  --bg2:      #FFFFFF;
  --bg3:      #EFEDE8;
  --ink:      #1A1917;
  --ink2:     #6B6860;
  --ink3:     #9E9B94;
  --ink4:     #C8C5BE;
  --sep:      #E8E5DF;

  /* Single accent — deep muted violet */
  --v:        #6B5CE7;
  --v-bg:     rgba(107,92,231,.08);
  --v-mid:    rgba(107,92,231,.15);

  /* Semantic */
  --green:    #3D9970;
  --green-bg: rgba(61,153,112,.08);
  --amber:    #C47D2A;
  --amber-bg: rgba(196,125,42,.08);
  --red:      #C44B3A;
  --red-bg:   rgba(196,75,58,.08);

  --r:        12px;
  --r-sm:     8px;
  --r-pill:   100px;
}

html,body{height:100%;overflow:hidden;background:#1A1917}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  display:flex;justify-content:center;align-items:center;
  font-size:15px;line-height:1.5;color:var(--ink);
}

/* ── SHELL ─────────────────────────────────────────────────────────────────── */
#shell{
  width:min(390px,100vw);
  height:min(844px,100vh);
  background:var(--bg);
  border-radius:clamp(0px,calc((100vw - 390px)*-99 + 44px),44px);
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 32px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
}

/* ── SCREENS ───────────────────────────────────────────────────────────────── */
#screens{flex:1;overflow:hidden;position:relative;min-height:0}
.screen{
  position:absolute;top:0;left:0;width:100%;height:100%;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;background:var(--bg);display:none;
}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}

/* ── TAB BAR ───────────────────────────────────────────────────────────────── */
#tabs{
  background:rgba(247,246,243,.94);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--sep);
  display:flex;
  padding:8px 0 max(18px,env(safe-area-inset-bottom,18px));
  flex-shrink:0;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;cursor:pointer;padding:4px 0;
}
.tab-ic{
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.tab-ic svg{stroke:var(--ink4);transition:stroke .15s}
.tab-lb{font-size:10px;font-weight:500;color:var(--ink4);transition:color .15s;letter-spacing:.2px}
.tab.on .tab-ic{transform:translateY(-1px)}
.tab.on .tab-ic svg{stroke:var(--v)}
.tab.on .tab-lb{color:var(--v)}

/* ── NAV BAR ───────────────────────────────────────────────────────────────── */
.nav{
  padding:max(14px,env(safe-area-inset-top,14px)) 20px 12px;
  display:flex;align-items:center;
  background:rgba(247,246,243,.94);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--sep);
  position:sticky;top:0;z-index:50;
  min-height:54px;
}
.nav-title{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:17px;font-weight:600;color:var(--ink);
  position:absolute;left:50%;transform:translateX(-50%);
  letter-spacing:-.2px;
}
.nav-back{
  font-size:14px;font-weight:500;color:var(--v);
  background:none;border:none;cursor:pointer;
  font-family:'DM Sans',system-ui,sans-serif;
  display:flex;align-items:center;gap:4px;z-index:1;
  padding:4px 0;letter-spacing:-.1px;
}
.nav-back svg{stroke:var(--v)}
.nav-action{
  font-size:14px;font-weight:500;color:var(--v);
  background:none;border:none;cursor:pointer;
  font-family:'DM Sans',system-ui,sans-serif;
  margin-left:auto;z-index:1;padding:4px 0;
}

/* ── LARGE TITLE ───────────────────────────────────────────────────────────── */
.ltitle-wrap{padding:28px 24px 20px}
.ltitle{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:40px;font-weight:300;line-height:1.1;
  letter-spacing:-.5px;color:var(--ink);
}
.ltitle strong{font-weight:600}
.ltitle em{font-style:italic;color:var(--v)}

/* ── SECTION LABEL ─────────────────────────────────────────────────────────── */
.slabel{
  font-size:11px;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.8px;
  padding:0 24px 10px;
}

/* ── CARDS ─────────────────────────────────────────────────────────────────── */
.cg{
  margin:0 16px 20px;
  background:var(--bg2);
  border-radius:var(--r);
  overflow:hidden;
  border:1px solid var(--sep);
}
.crow{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  border:none;background:none;width:100%;text-align:left;
  cursor:pointer;transition:background .1s;position:relative;
}
.crow:active{background:var(--bg3)}
.crow+.crow::before{
  content:'';position:absolute;top:0;left:18px;right:0;
  height:1px;background:var(--sep);
}
.chev{
  margin-left:auto;flex-shrink:0;
  color:var(--ink4);font-size:13px;
}
.chev svg{stroke:var(--ink4)}

/* ── AVATAR ────────────────────────────────────────────────────────────────── */
.ava{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:16px;font-weight:600;color:#fff;
  letter-spacing:-.3px;
}

/* ── PERSON ROW ────────────────────────────────────────────────────────────── */
.pname{
  font-size:15px;font-weight:500;color:var(--ink);
  letter-spacing:-.2px;
}
.pmeta{display:flex;align-items:center;gap:8px;margin-top:3px}
.pill{
  font-size:10px;font-weight:600;
  padding:2px 8px;border-radius:var(--r-pill);
  letter-spacing:.1px;
}
.ptime{font-size:12px;color:var(--ink3)}

/* ── BOND RING ─────────────────────────────────────────────────────────────── */
.ring-wrap{
  position:relative;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.ring-label{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;letter-spacing:-.5px;
}

/* ── STATS ROW ─────────────────────────────────────────────────────────────── */
.stats{
  display:flex;gap:10px;
  margin:0 16px 24px;
}
.stat{
  flex:1;background:var(--bg2);border-radius:var(--r);
  padding:16px 14px;text-align:center;
  border:1px solid var(--sep);
}
.stat-n{
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:32px;font-weight:600;line-height:1;
  letter-spacing:-1px;color:var(--v);
}
.stat-l{
  font-size:10px;font-weight:500;color:var(--ink3);
  margin-top:5px;line-height:1.3;letter-spacing:.1px;text-transform:uppercase;
}

/* ── ATTENTION BANNER ──────────────────────────────────────────────────────── */
.attn{
  margin:0 16px 20px;
  border-radius:var(--r);padding:14px 18px;
  background:var(--amber-bg);
  border:1px solid rgba(196,125,42,.18);
  display:flex;align-items:center;gap:14px;cursor:pointer;
}
.attn-title{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.attn-sub{font-size:12px;color:var(--ink2);margin-top:2px}
.attn-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--amber);flex-shrink:0;
}

/* ── PROFILE HERO ──────────────────────────────────────────────────────────── */
.phero{
  background:var(--bg2);
  border-bottom:1px solid var(--sep);
  padding:24px 24px 20px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin-bottom:24px;
}
.p-ava-lg{
  width:72px;height:72px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:28px;font-weight:600;color:#fff;
}
.pn-lg{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;font-weight:600;letter-spacing:-.5px;color:var(--ink);
}
.p-actions{display:flex;gap:10px;width:100%}
.p-act{
  flex:1;border:1px solid var(--sep);border-radius:var(--r-sm);
  padding:11px 8px;cursor:pointer;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:background .15s,border-color .15s;
}
.p-act:active{background:var(--bg3)}
.p-act svg{stroke:var(--v)}
.p-act-lb{font-size:12px;font-weight:500;color:var(--v);letter-spacing:-.1px}

/* ── SCORE BARS ────────────────────────────────────────────────────────────── */
.sbar-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.sbar-row+.sbar-row{border-top:1px solid var(--sep)}
.sbar-lbl{font-size:12px;color:var(--ink2);width:72px;flex-shrink:0;letter-spacing:-.1px}
.sbar-track{flex:1;height:3px;background:var(--sep);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;border-radius:2px;background:var(--v)}
.sbar-val{font-size:12px;font-weight:600;color:var(--v);width:22px;text-align:right;flex-shrink:0}

/* ── TIMELINE ──────────────────────────────────────────────────────────────── */
.tl-item{display:flex;gap:14px;padding:14px 0;position:relative}
.tl-item+.tl-item::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--sep)}
.tl-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--v);flex-shrink:0;margin-top:7px;
  opacity:.5;
}
.tl-date{font-size:11px;color:var(--ink3);font-weight:500;margin-bottom:4px;letter-spacing:.1px;text-transform:uppercase}
.tl-note{font-size:14px;color:var(--ink2);line-height:1.6}

/* ── CHIPS ─────────────────────────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px}
.chip{
  background:var(--bg3);border-radius:var(--r-sm);
  font-size:12px;color:var(--ink2);font-weight:400;
  padding:5px 12px;border:1px solid var(--sep);
}

/* ── BUTTONS ───────────────────────────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:15px;font-weight:600;
  border-radius:var(--r);padding:15px;width:100%;
  transition:opacity .15s,transform .1s;
  letter-spacing:-.1px;
}
.btn:active{opacity:.8;transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-p{background:var(--v);color:#fff}
.btn-s{
  background:var(--bg2);color:var(--v);
  border:1px solid var(--sep);
}
.btn-d{background:var(--red-bg);color:var(--red);border:1px solid rgba(196,75,58,.15)}
.btn-sm{font-size:13px;padding:12px}

/* ── INPUTS ────────────────────────────────────────────────────────────────── */
.fsec{margin:0 16px 20px}
.flbl{
  font-size:11px;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.6px;padding:0 4px 8px;
}
.fbox{
  background:var(--bg2);border-radius:var(--r);
  overflow:hidden;border:1px solid var(--sep);
}
input.fi,textarea.fi{
  width:100%;padding:14px 16px;border:none;outline:none;
  font-size:15px;font-family:'DM Sans',system-ui,sans-serif;
  color:var(--ink);background:transparent;-webkit-appearance:none;
  line-height:1.5;
}
input.fi::placeholder,textarea.fi::placeholder{color:var(--ink4)}
textarea.fi{resize:none}
.fi-row+.fi-row{border-top:1px solid var(--sep)}

/* ── TAG SELECTOR ──────────────────────────────────────────────────────────── */
.tgrid{
  background:var(--bg2);border-radius:var(--r);
  padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;
  border:1px solid var(--sep);
}
.topt{
  padding:6px 14px;border-radius:var(--r-pill);
  font-size:13px;font-weight:500;
  border:1px solid var(--sep);cursor:pointer;
  transition:all .15s;background:var(--bg);color:var(--ink2);
}
.topt.on{
  background:var(--v-bg);color:var(--v);
  border-color:rgba(107,92,231,.25);font-weight:600;
}

/* ── CAPTURE BOX ───────────────────────────────────────────────────────────── */
.capture-wrap{
  margin:0 16px 16px;
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--sep);overflow:hidden;
}
.capture-ta{
  width:100%;padding:18px 18px 8px;border:none;outline:none;
  font-size:15px;line-height:1.65;
  font-family:'DM Sans',system-ui,sans-serif;
  color:var(--ink);background:transparent;resize:none;
  -webkit-appearance:none;min-height:120px;
}
.capture-ta::placeholder{color:var(--ink4)}
.capture-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 14px;
}
.capture-hint{font-size:12px;color:var(--ink3);font-style:italic}
.capture-btn{
  background:var(--v);color:#fff;border:none;cursor:pointer;
  border-radius:var(--r-sm);padding:9px 18px;
  font-size:13px;font-weight:600;
  font-family:'DM Sans',system-ui,sans-serif;
  transition:opacity .15s,transform .1s;flex-shrink:0;
  letter-spacing:-.1px;
}
.capture-btn:active{opacity:.8;transform:scale(.97)}
.capture-btn:disabled{opacity:.3;cursor:not-allowed}

/* ── EXAMPLE PROMPTS ───────────────────────────────────────────────────────── */
.prompt-hint{
  margin:0 16px 20px;
  display:flex;align-items:center;gap:10px;
  padding:0 2px;
}
.prompt-hint-label{
  font-size:10px;font-weight:600;color:var(--ink4);
  text-transform:uppercase;letter-spacing:.7px;
  flex-shrink:0;
}
.prompt-hint-text{
  font-size:13px;color:var(--ink3);font-style:italic;
  line-height:1.4;
  transition:opacity .4s ease;
}
.prompt-hint-text.fade{opacity:0}

/* ── BRIEFING ──────────────────────────────────────────────────────────────── */
.brief-open{
  margin:0 16px 20px;
  background:var(--bg2);border-radius:var(--r);
  padding:20px 20px;border:1px solid var(--sep);
}
.brief-lbl{
  font-size:10px;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;
}
.brief-open-txt{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:20px;font-style:italic;font-weight:300;
  color:var(--ink);line-height:1.65;
}
.bbul{display:flex;gap:14px;align-items:flex-start;padding:13px 0}
.bbul+.bbul{border-top:1px solid var(--sep)}
.bdot{
  width:5px;height:5px;border-radius:50%;
  background:var(--v);flex-shrink:0;margin-top:8px;opacity:.6;
}
.btxt{font-size:14px;color:var(--ink2);line-height:1.6}
.brief-close{
  margin:0 16px 32px;
  background:var(--green-bg);
  border:1px solid rgba(61,153,112,.15);
  border-radius:var(--r);padding:16px 18px;
}
.brief-close-txt{font-size:13px;color:var(--green);line-height:1.55}

/* ── MODAL SHEET ───────────────────────────────────────────────────────────── */
.overlay{
  position:absolute;inset:0;
  background:rgba(26,25,23,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:flex-end;
}
.sheet{
  background:var(--bg2);border-radius:20px 20px 0 0;width:100%;
  padding:8px 20px max(40px,env(safe-area-inset-bottom,40px));
  max-height:82%;overflow-y:auto;border-top:1px solid var(--sep);
}
.handle{
  width:32px;height:3px;background:var(--ink4);
  border-radius:2px;margin:10px auto 20px;
}
.sheet-title{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:600;margin-bottom:6px;
  letter-spacing:-.3px;color:var(--ink);
}
.sheet-sub{font-size:14px;color:var(--ink2);margin-bottom:20px;line-height:1.55}

/* ── LOADING ───────────────────────────────────────────────────────────────── */
.ldg{display:flex;flex-direction:column;align-items:center;padding:70px 20px;gap:18px}
.spin{
  width:28px;height:28px;border-radius:50%;
  border:2px solid var(--sep);border-top-color:var(--v);
  animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.ldg-t{font-size:14px;color:var(--ink3);text-align:center;line-height:1.6}

/* ── EMPTY STATE ───────────────────────────────────────────────────────────── */
.empty{
  display:flex;flex-direction:column;align-items:center;
  padding:60px 32px;text-align:center;
}
.empty-mark{
  font-family:'Cormorant Garamond',serif;
  font-size:48px;font-style:italic;color:var(--ink4);
  margin-bottom:20px;font-weight:300;line-height:1;
}
.empty-t{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;font-weight:600;margin-bottom:10px;
  color:var(--ink);letter-spacing:-.3px;
}
.empty-s{font-size:14px;color:var(--ink2);line-height:1.65;margin-bottom:28px}

/* ── DIVIDER LINE ──────────────────────────────────────────────────────────── */
.rule{height:1px;background:var(--sep);margin:0 16px 20px}

/* ── ANIMATIONS ────────────────────────────────────────────────────────────── */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.a{animation:up .25s cubic-bezier(.4,0,.2,1) both}
.a1{animation-delay:.04s}.a2{animation-delay:.08s}
.a3{animation-delay:.12s}.a4{animation-delay:.16s}

.sp{height:40px}
.ph{padding:0 16px}
.pad-top{padding-top:max(14px,env(safe-area-inset-top,14px))}
</style>
</head>
<body>
<div id="shell">
  <div id="screens">
    <div class="screen" id="s-home"></div>
    <div class="screen" id="s-capture"></div>
    <div class="screen" id="s-profile"></div>
    <div class="screen" id="s-log"></div>
    <div class="screen" id="s-brief"></div>
    <div class="screen" id="s-you"></div>
  </div>
  <nav id="tabs">
    <button class="tab" id="t-home" onclick="A.tab('home')">
      <div class="tab-ic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12L12 3L21 12V20C21 20.55 20.55 21 20 21H15V16H9V21H4C3.45 21 3 20.55 3 20V12Z"/>
        </svg>
      </div>
      <span class="tab-lb">Circle</span>
    </button>
    <button class="tab" id="t-capture" onclick="A.tab('capture')">
      <div class="tab-ic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5C12 5 8 9 8 13C8 15.21 9.79 17 12 17C14.21 17 16 15.21 16 13C16 9 12 5 12 5Z"/>
          <path d="M12 17V21M9 21H15"/>
        </svg>
      </div>
      <span class="tab-lb">Capture</span>
    </button>
    <button class="tab" id="t-you" onclick="A.tab('you')">
      <div class="tab-ic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20C4 17 7.58 15 12 15C16.42 15 20 17 20 20"/>
        </svg>
      </div>
      <span class="tab-lb">You</span>
    </button>
  </nav>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const ME = "Justin";
const TAGS = ["Friend","Family","Dating","Network","Work"];
const TAG_S = {
  Friend:  {bg:"rgba(107,92,231,.1)", c:"#6B5CE7"},
  Family:  {bg:"rgba(196,75,58,.1)",  c:"#C44B3A"},
  Dating:  {bg:"rgba(196,125,42,.1)", c:"#C47D2A"},
  Network: {bg:"rgba(61,153,112,.1)", c:"#3D9970"},
  Work:    {bg:"rgba(107,92,231,.08)",c:"#5A4FCC"},
};
const COLORS = ["#6B5CE7","#3D9970","#C47D2A","#C44B3A","#5A4FCC","#2E7D52","#A0522D","#4A5568"];
const SCREENS = ["home","capture","profile","log","brief","you"];

// ── INPUT VALIDATION LIMITS ───────────────────────────────────────────────────
const LIMITS = {
  name:50, note:1000, detail:120, details:20, logs:200,
};

// ── SANITIZATION ─────────────────────────────────────────────────────────────
function esc(str){
  if(typeof str!=="string") return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#x27;");
}
function sanitize(str,maxLen=500){
  if(typeof str!=="string") return "";
  return str.trim().slice(0,maxLen);
}
function validatePerson(p){
  if(!p||typeof p!=="object") return false;
  if(typeof p.id!=="string"||!p.id) return false;
  if(typeof p.name!=="string"||!p.name.trim()) return false;
  if(!TAGS.includes(p.tag)) return false;
  return true;
}

// ── DB ────────────────────────────────────────────────────────────────────────
const DB={
  all(){try{const r=JSON.parse(localStorage.getItem("fam4")||"[]");return Array.isArray(r)?r.filter(validatePerson):[];}catch{return[]}},
  save(d){localStorage.setItem("fam4",JSON.stringify(d))},
  upsert(p){
    if(!validatePerson(p))return;
    if(Array.isArray(p.logs))p.logs=p.logs.slice(0,LIMITS.logs);
    if(Array.isArray(p.details))p.details=p.details.slice(0,LIMITS.details);
    const d=this.all(),i=d.findIndex(x=>x.id===p.id);
    i>=0?d[i]=p:d.push(p);this.save(d);
  },
  del(id){this.save(this.all().filter(p=>p.id!==id))},
};

// ── BOND ──────────────────────────────────────────────────────────────────────
// Memory weight tiers — PRD §7.4
// long-term details count fully, medium half, short-term 0 (they decay)
function memoryWeight(det){
  if(!Array.isArray(det)) return 0;
  return det.reduce((sum,d)=>{
    const w = typeof d==="object" ? d.weight||"long" : "long";
    return sum + (w==="long"?1 : w==="medium"?0.5 : 0);
  },0);
}

function bond(p){
  const now=Date.now(),logs=p.logs||[],det=p.details||[];
  // Recency (30pts)
  let rec=0;
  if(logs.length){const d=(now-logs[0].ts)/864e5;rec=d<=7?30:d<=14?22:d<=30?14:d<=60?6:0}
  // Frequency — interactions in last 90 days (25pts)
  const r90=logs.filter(l=>(now-l.ts)<90*864e5).length;
  const freq=r90>=8?25:r90>=5?18:r90>=3?12:r90>=2?7:r90>=1?3:0;
  // Depth — weighted by memory tier, not raw count (25pts)
  const wt=memoryWeight(det);
  const dep=wt>=10?25:wt>=7?18:wt>=4?12:wt>=2?6:wt>=1?2:0;
  // Activity — total log count capped (20pts)
  return Math.min(100,rec+freq+dep+Math.min(20,logs.length*3));
}
const bColor=s=>s>=65?"#3D9970":s>=45?"#C47D2A":"#C44B3A";
const bLabel=s=>s>=85?"Strong":s>=65?"Solid":s>=45?"Fading":"Dormant";

function ring(score,sz=42){
  const r=(sz-5)/2,c=2*Math.PI*r,fill=(score/100)*c,col=bColor(score);
  return `<div class="ring-wrap" style="width:${sz}px;height:${sz}px">
    <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="transform:rotate(-90deg)">
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}20" stroke-width="2.5"/>
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="2.5"
        stroke-dasharray="${fill} ${c}" stroke-linecap="round"/>
    </svg>
    <div class="ring-label" style="color:${col};font-size:${sz>50?14:10}px">${score}</div>
  </div>`;
}

// ── CLAUDE ────────────────────────────────────────────────────────────────────
const WORKER="https://familiarworker.justincartagenova.workers.dev/";
async function claude(sys,usr,mt=800){
  const safeSys=sanitize(sys,2000),safeUsr=sanitize(usr,1000),safeMt=Math.min(Math.max(parseInt(mt,10)||800,100),1000);
  const r=await fetch(WORKER,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:safeMt,system:safeSys,messages:[{role:"user",content:safeUsr}]})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||`HTTP ${r.status}`)}
  const d=await r.json();
  return d.content?.[0]?.text||"";
}
function pj(t){try{return JSON.parse(t.replace(/```json\n?|```/g,"").trim())}catch{return null}}

const ago=ts=>{
  if(!ts)return"Never";
  const s=(Date.now()-ts)/1000;
  if(s<60)return"Just now";
  if(s<3600)return`${~~(s/60)}m ago`;
  if(s<86400)return`${~~(s/3600)}h ago`;
  if(s<604800)return`${~~(s/86400)}d ago`;
  if(s<2592e3)return`${~~(s/604800)}w ago`;
  return`${~~(s/2592e3)}mo ago`;
};
const tagPill=t=>{
  const safe=TAGS.includes(t)?t:"Friend";
  const s=TAG_S[safe];
  return`<span class="pill" style="background:${s.bg};color:${s.c}">${esc(safe)}</span>`;
};

  async submitCapture(){
    const note=sanitize($("cap-ta")?.value,LIMITS.note);
    if(!note)return;
    H("s-capture",`
      <div class="nav"><span class="nav-title">Processing</span></div>
      <div class="ldg"><div class="spin"></div>
      <div class="ldg-t">Reading your note…</div></div>
    `);
    const people=DB.all();
    const namesList=people.map(p=>p.name).join(", ")||"none";
    let result=null;
    try{
      const txt=await claude(
        `You are Familiar, a relationship intelligence AI for ${ME}.
Analyse a note. Decide if EXISTING person or NEW person.
Existing people: ${namesList}

Extract three types of information:

ANCHORS — stable identity facts (birthday, job, hometown, siblings, health, core interests, relationship status)
  weight: "long", importance: 70-100

TOPICS — currently relevant conversation topics (new job, upcoming trip, hobby, recent event, project)
  weight: "medium", importance: 40-69, relevance_window_days: 30-90

UPDATES — temporary context (bought something, minor daily event, mood)
  weight: "short", importance: 10-39, relevance_window_days: 1-7

If EXISTING person (fuzzy name match ok):
{"action":"log","personName":"exact name from list","note":"full note",
"newDetails":[{"text":"fact text","weight":"long|medium|short","importance":80,"relevance_window_days":null}],
"topics":[{"text":"topic text","importance":55,"relevance_window_days":60}],
"summary":"one sentence","followUps":["specific actionable follow-up"]}

If NEW person:
{"action":"new","personName":"their name","identifier":"optional descriptor e.g. friend from uni, colleague at Deloitte",
"tag":"Friend|Family|Dating|Network|Work",
"details":[{"text":"fact text","weight":"long|medium|short","importance":80,"relevance_window_days":null}],
"topics":[{"text":"topic text","importance":55,"relevance_window_days":60}],
"note":"full note","summary":"one sentence"}

Return ONLY valid JSON. Tag must be one of: Friend, Family, Dating, Network, Work.`,
        `Note: "${note}"`,800);
      result=pj(txt);
    }catch(e){}
    if(!result)result=this._fallbackParse(note,people);
    if(result.action==="log"){
      const p=people.find(x=>x.name.toLowerCase()===result.personName?.toLowerCase())||people.find(x=>x.name.toLowerCase().includes(result.personName?.toLowerCase().split(" ")[0]));
      if(!p){await this.createNewPerson(result,note);return;}
      const now=Date.now();
      // Normalise and merge anchor details
      const incomingDetails=(result.newDetails||[]).map(d=>
        typeof d==="string"
          ?{text:d,weight:"long",importance:70,relevance_window_days:null,ts:now,last_referenced_at:now}
          :{text:d.text||d,weight:d.weight||"long",importance:d.importance||70,relevance_window_days:d.relevance_window_days||null,ts:now,last_referenced_at:now}
      );
      const existingTexts=new Set((p.details||[]).map(d=>typeof d==="string"?d:d.text));
      const mergedDetails=[...(p.details||[]),...incomingDetails.filter(d=>!existingTexts.has(d.text))];
      // Merge topics — update existing by text match, add new ones
      const incomingTopics=(result.topics||[]).map(t=>({
        text:t.text||t,importance:t.importance||50,
        relevance_window_days:t.relevance_window_days||60,
        ts:now,last_referenced_at:now,status:"active"
      }));
      const existingTopicTexts=new Set((p.topics||[]).map(t=>t.text));
      const refreshedExisting=(p.topics||[]).map(t=>{
        const match=incomingTopics.find(it=>it.text===t.text);
        return match?{...t,last_referenced_at:now,status:"active"}:t;
      });
      const brandNewTopics=incomingTopics.filter(t=>!existingTopicTexts.has(t.text));
      const mergedTopics=[...refreshedExisting,...brandNewTopics].slice(0,15);
      // Follow-ups
      const newFollowUps=(result.followUps||[]).map(f=>({text:f,ts:now,done:false}));
      const existingFU=(p.followUps||[]).filter(f=>!f.done && (now-f.ts)<14*864e5);
      DB.upsert({...p,logs:[{note,ts:now},...(p.logs||[])],details:mergedDetails,topics:mergedTopics,followUps:[...newFollowUps,...existingFU].slice(0,10)});
      this.showCaptureResult("interaction",p.name,result,p.id);
    } else {
      await this.createNewPerson(result,note);
    }
  },

  _fallbackParse(note,people){
    const words=note.split(/\s+/);
    for(const p of people){
      const first=p.name.split(" ")[0].toLowerCase();
      if(words.some(w=>w.toLowerCase().replace(/[^a-z]/g,"")===first))
        return{action:"log",personName:p.name,note,newDetails:[],summary:"Interaction logged.",followUps:[]};
    }
    const stop=new Set(["i","the","a","an","with","had","met","saw","caught","up","for","and","to","at","in","on","she","he","we","my","just","so","they","from"]);
    const names=words.filter(w=>/^[A-Z][a-z]{1,}$/.test(w)&&!stop.has(w.toLowerCase()));
    return{action:"new",personName:names[0]||"New Person",tag:"Friend",details:[],note,summary:"Added to your circle."};
  },

  async createNewPerson(result,note){
    const color=COLORS[DB.all().length%COLORS.length];
    const now=Date.now();
    const details=(result.details||[]).map(d=>
      typeof d==="string"
        ?{text:d,weight:"long",importance:70,relevance_window_days:null,ts:now,last_referenced_at:now}
        :{text:d.text||d,weight:d.weight||"long",importance:d.importance||70,relevance_window_days:d.relevance_window_days||null,ts:now,last_referenced_at:now}
    );
    const topics=(result.topics||[]).map(t=>({
      text:t.text||t,importance:t.importance||50,
      relevance_window_days:t.relevance_window_days||60,
      ts:now,last_referenced_at:now,status:"active"
    }));
    const np={
      id:now+"",
      name:result.personName||"Unknown",
      identifier:result.identifier||"",
      tag:result.tag||"Friend",
      color,details,topics,
      logs:[{note,ts:now}]
    };
    DB.upsert(np);
    this.showCaptureResult("new",np.name,result,np.id);
  },

        <div style="margin-top:6px">${tagPill(p.tag)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        ${ring(p.b,60)}
        <div>
          <div style="font-size:20px;font-weight:600;color:${bColor(p.b)};letter-spacing:-.3px">${bLabel(p.b)}</div>
          <div style="font-size:12px;color:var(--ink3);margin-top:2px">Bond score ${p.b} / 100</div>
        </div>
      </div>
      <div class="p-actions">
        <button class="p-act" onclick="A.briefing('${id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C12 2 8 7 8 12C8 14.21 9.79 16 12 16C14.21 16 16 14.21 16 12C16 7 12 2 12 2Z"/>
            <path d="M12 16V20M9 20H15"/>
          </svg>
          <div class="p-act-lb">Briefing</div>
        </button>
        <button class="p-act" onclick="A.openLog('${id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20H21M16.5 3.5A2.121 2.121 0 0 1 19.5 6.5L7 19L3 20L4 16L16.5 3.5Z"/>
          </svg>
          <div class="p-act-lb">Log</div>
        </button>
      </div>
    </div>
    // ── RELEVANCE ENGINE ───────────────────────────────────────────────────────
    // PRD v0.2: rank by base_importance × time_decay, not raw recency
    const now=Date.now();

    function relevanceScore(item){
      const base=item.importance||50;
      const ts=item.ts||now;
      const windowDays=item.relevance_window_days||null;
      const ageDays=(now-ts)/864e5;
      if(!windowDays) return base; // long-term anchors: no decay
      const decay=Math.max(0, 1-(ageDays/windowDays));
      return base*decay;
    }

    // Filter and rank active topics
    const activeTopics=(p.topics||[])
      .filter(t=>{
        const ageDays=(now-(t.ts||0))/864e5;
        const window=t.relevance_window_days||60;
        return ageDays<window && t.status!=="archived";
      })
      .map(t=>({...t,score:relevanceScore(t)}))
      .sort((a,b)=>b.score-a.score)
      .slice(0,5);

    // Filter and rank anchor facts (long-term only — no decay)
    const anchors=(p.details||[])
      .filter(d=>{
        const weight=typeof d==="object"?d.weight:"long";
        const ts=typeof d==="object"?d.ts:0;
        if(weight==="short") return (now-ts)<30*864e5;
        if(weight==="medium") return (now-ts)<90*864e5;
        return true;
      })
      .map(d=>({...d,score:relevanceScore(d)}))
      .sort((a,b)=>b.score-a.score);

    const anchorLong=anchors.filter(d=>(d.weight||"long")==="long");
    const anchorMed=anchors.filter(d=>(d.weight||"long")==="medium");
    const anchorShort=anchors.filter(d=>(d.weight||"long")==="short");
    const detText=d=>esc(typeof d==="object"?d.text:d);

    // Active follow-ups
    const activeFU=(p.followUps||[]).filter(f=>!f.done&&(now-f.ts)<14*864e5);

    // ── SECTION 1: FOLLOW-UPS (highest priority — action-driving) ─────────────
    if(activeFU.length){
      h+=`<div class="slabel a1">Follow up</div>
      <div class="cg a1" style="margin-bottom:20px">`;
      activeFU.forEach((f,i)=>{
        h+=`<div class="crow" style="cursor:default;gap:12px;align-items:flex-start">
          <div style="width:6px;height:6px;border-radius:50%;background:var(--v);flex-shrink:0;margin-top:7px;opacity:.7"></div>
          <div style="flex:1;font-size:14px;color:var(--ink);line-height:1.55;font-weight:500">${esc(f.text)}</div>
          <button onclick="A.dismissFollowUp('${id}',${i})"
            style="font-size:11px;color:var(--ink3);background:none;border:1px solid var(--sep);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:'DM Sans',system-ui,sans-serif;flex-shrink:0;margin-top:2px">Done</button>
        </div>`;
      });
      h+=`</div>`;
    }

    // ── SECTION 2: ACTIVE TOPICS (what to talk about) ─────────────────────────
    if(activeTopics.length){
      h+=`<div class="slabel a2">Conversation topics</div>
      <div class="cg a2" style="padding:12px 18px 14px;margin-bottom:20px">`;
      activeTopics.forEach(t=>{
        const freshness=Math.round(t.score);
        const barW=Math.min(100,freshness);
        h+=`<div style="display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--sep)">
          <div style="flex:1;font-size:14px;color:var(--ink2)">${esc(t.text)}</div>
          <div style="width:40px;height:3px;background:var(--sep);border-radius:2px;flex-shrink:0">
            <div style="width:${barW}%;height:100%;background:var(--v);border-radius:2px;opacity:.6"></div>
          </div>
        </div>`;
      });
      h+=`</div>`;
    }

    // ── SECTION 3: ANCHORS (who this person is) ────────────────────────────────
    if(anchors.length){
      h+=`<div class="slabel a3">Who they are</div>
      <div class="cg a3" style="margin-bottom:20px"><div class="chips" style="padding:12px 16px">`;
      anchorLong.forEach(d=>{h+=`<div class="chip">${detText(d)}</div>`});
      anchorMed.forEach(d=>{h+=`<div class="chip" style="opacity:.7;font-style:italic">${detText(d)}</div>`});
      anchorShort.forEach(d=>{h+=`<div class="chip" style="opacity:.4;font-size:11px;font-style:italic">${detText(d)}</div>`});
      h+=`</div></div>`;
    }

    // ── SECTION 4: BOND BREAKDOWN (collapsed visual) ───────────────────────────
    h+=`<div class="slabel a4">Bond breakdown</div>
    <div class="cg a4" style="padding:4px 18px;margin-bottom:20px">`;
    sc.forEach(r=>{h+=`<div class="sbar-row">
      <span class="sbar-lbl">${r.l}</span>
      <div class="sbar-track"><div class="sbar-fill" style="width:${Math.min(100,(r.v/25)*100)}%"></div></div>
      <span class="sbar-val">${r.v}</span>
    </div>`});
    h+=`</div>`;

    // ── SECTION 5: INTERACTION HISTORY (secondary, full log) ──────────────────
    const showHistory=p.logs&&p.logs.length>0;
    h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px">
      <span class="slabel" style="padding:0">History</span>
      ${showHistory?`<span style="font-size:11px;color:var(--ink3)">${p.logs.length} interaction${p.logs.length!==1?"s":""}</span>`:""}
    </div>`;
    if(!showHistory){
      h+=`<div class="cg" style="padding:18px;text-align:center">
        <p style="color:var(--ink3);font-size:13px">No interactions yet.</p>
      </div>`;
    } else {
      h+=`<div class="cg" style="padding:4px 18px">`;
      p.logs.slice(0,10).forEach(l=>{h+=`<div class="tl-item">
        <div class="tl-dot"></div>
        <div>
          <div class="tl-date">${ago(l.ts)}</div>
          <div class="tl-note">${esc(l.note)}</div>
        </div>
      </div>`});
      if(p.logs.length>10){
        h+=`<div style="padding:12px 0;text-align:center;font-size:12px;color:var(--ink3);border-top:1px solid var(--sep)">${p.logs.length-10} older interactions</div>`;
      }
      h+=`</div>`;
    }
    h+=`<div class="ph" style="padding-bottom:40px;margin-top:20px">
      <button class="btn btn-d btn-sm" onclick="A.deletePerson('${id}')">Remove from circle</button>
    </div><div class="sp"></div>`;
    H("s-profile",h);
  },

  // ── LOG ───────────────────────────────────────────────────────────────────
  openLog(id){
    S.pid=id;
    const p=DB.all().find(x=>x.id===id);
    S.stack=["home","profile","log"];
    H("s-log",`
      <div class="nav">
        <button class="nav-back" onclick="A.backToProfile()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M15 18L9 12L15 6"/></svg>
          ${p?esc(p.name):"Back"}
        </button>
        <span class="nav-title">Log</span>
      </div>
      <div style="padding:20px 16px">
        <div class="fsec" style="margin-bottom:6px">
          <div class="flbl">What happened?</div>
          <div class="fbox">
            <textarea class="fi" id="lognote" rows="10"
              placeholder="Write freely — what did you talk about, what did they mention, how did they seem?&#10;&#10;e.g. Grabbed coffee. She just got promoted. Her sister Emma is visiting from Sydney next week…"></textarea>
          </div>
        </div>
        <div style="font-size:11px;color:var(--ink3);text-align:right;padding:0 4px 20px" id="log-wc">Start writing…</div>
        <button class="btn btn-p" id="log-sub" disabled onclick="A.submitLog('${id}',document.getElementById('lognote').value)">
          Save
        </button>
      </div>
    `);
    const ta=$("lognote"),wc=$("log-wc"),sb=$("log-sub");
    if(ta){
      ta.addEventListener("input",()=>{
        const w=ta.value.trim().split(/\s+/).filter(Boolean).length;
        wc.textContent=ta.value.trim()?w+" words":"Start writing…";
        sb.disabled=!ta.value.trim();
      });
      setTimeout(()=>ta.focus(),80);
    }
    showOnly("s-log");
  },

  async submitLog(id,rawNote){
    const note=sanitize(rawNote,LIMITS.note);
    if(!note)return;
    const p=DB.all().find(x=>x.id===id);if(!p)return;
    H("s-log",`
      <div class="nav"><span class="nav-title">Saving</span></div>
      <div class="ldg"><div class="spin"></div>
      <div class="ldg-t">Updating ${esc(p.name)}'s profile…</div></div>
    `);
    let res={newDetails:[],summary:"Interaction saved.",followUps:[]};
    try{
      const txt=await claude(
        `You are Familiar, a relationship intelligence AI for ${ME}.
Extract structured info from a note about ${sanitize(p.name,50)} (${p.tag}).
Already known anchors: ${(p.details||[]).filter(d=>(typeof d==="object"?d.weight:"long")==="long").map(d=>typeof d==="object"?d.text:d).join(", ")||"none"}.

Extract:
- newDetails: NEW anchor facts not already known (weight: long/medium/short, importance: 0-100)
- topics: currently relevant conversation topics (importance: 0-100, relevance_window_days: 7-90)
- followUps: specific actionable follow-ups
- summary: one sentence of what happened

Return ONLY valid JSON:
{"newDetails":[{"text":"fact","weight":"long|medium|short","importance":80,"relevance_window_days":null}],
"topics":[{"text":"topic","importance":60,"relevance_window_days":45}],
"summary":"one sentence","followUps":["actionable follow-up"]}`,
        `"${note}"`,600);
      res=pj(txt)||res;
    }catch(e){}
    const now2=Date.now();
    const logIncoming=(res.newDetails||[]).map(d=>
      typeof d==="string"
        ?{text:d,weight:"long",importance:70,relevance_window_days:null,ts:now2,last_referenced_at:now2}
        :{text:d.text||d,weight:d.weight||"long",importance:d.importance||70,relevance_window_days:d.relevance_window_days||null,ts:now2,last_referenced_at:now2}
    );
    const logExistingTexts=new Set((p.details||[]).map(d=>typeof d==="string"?d:d.text));
    const logMerged=[...(p.details||[]),...logIncoming.filter(d=>!logExistingTexts.has(d.text))];
    // Merge topics from log
    const logTopics=(res.topics||[]).map(t=>({
      text:t.text||t,importance:t.importance||50,
      relevance_window_days:t.relevance_window_days||60,
      ts:now2,last_referenced_at:now2,status:"active"
    }));
    const logExistingTopicTexts=new Set((p.topics||[]).map(t=>t.text));
    const logRefreshedTopics=(p.topics||[]).map(t=>{
      const match=logTopics.find(it=>it.text===t.text);
      return match?{...t,last_referenced_at:now2,status:"active"}:t;
    });
    const logNewTopics=logTopics.filter(t=>!logExistingTopicTexts.has(t.text));
    const logMergedTopics=[...logRefreshedTopics,...logNewTopics].slice(0,15);
    const logFU=(res.followUps||[]).map(f=>({text:f,ts:now2,done:false}));
    const existingFU2=(p.followUps||[]).filter(f=>!f.done && (now2-f.ts)<14*864e5);
    DB.upsert({...p,logs:[{note,ts:now2},...(p.logs||[])],details:logMerged,topics:logMergedTopics,followUps:[...logFU,...existingFU2].slice(0,10)});
    this.backToProfile();this.renderProfile(id);
    const modal=`<div class="overlay" id="log-modal">
      <div class="sheet">
        <div class="handle"></div>
        <div class="sheet-title">Logged</div>
        <div class="sheet-sub">${esc(res.summary||"Saved.")}</div>
        ${res.newDetails?.length?`
          <div class="slabel" style="padding:0 0 8px">Added to profile</div>
          <div class="cg" style="margin:0 0 12px">
            ${res.newDetails.map(d=>`<div style="display:flex;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--sep)">
              <span style="color:var(--v);font-size:12px;font-weight:600;flex-shrink:0">Anchor</span>
              <span style="font-size:13px;color:var(--ink2)">${esc(typeof d==="object"?d.text:d)}</span>
            </div>`).join("")}
          </div>`:""}
        ${res.topics?.length?`
          <div class="slabel" style="padding:0 0 8px">Active topics</div>
          <div class="cg" style="margin:0 0 12px">
            ${res.topics.map(t=>`<div style="display:flex;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--sep)">
              <span style="color:var(--amber);font-size:12px;font-weight:600;flex-shrink:0">Topic</span>
              <span style="font-size:13px;color:var(--ink2)">${esc(typeof t==="object"?t.text:t)}</span>
            </div>`).join("")}
          </div>`:""}
        ${res.followUps?.length?`
          <div class="slabel" style="padding:0 0 8px">Follow up on</div>
          <div class="cg" style="margin:0 0 16px">
            ${res.followUps.map(f=>`<div style="font-size:13px;color:var(--ink2);padding:9px 16px;border-top:1px solid var(--sep)">— ${esc(f)}</div>`).join("")}
          </div>`:""}
        <button class="btn btn-p" onclick="document.getElementById('log-modal').remove()">Done</button>
      </div>
    </div>`;
    $("s-profile").insertAdjacentHTML("beforeend",modal);
  },

  backToProfile(){
    S.stack=S.stack.filter(s=>s!=="log");
    this.renderProfile(S.pid);showOnly("s-profile");
  },

        `About ${bp.name} (${bp.tag}):
Details: ${(()=>{

  return (bp.details||[])
    .filter(d=>{
      const w=typeof d==="object"?d.weight:"long";

})()}
Active topics: ${(()=>{

})()}
Follow-ups pending: ${(bp.followUps||[]).filter(f=>!f.done&&(Date.now()-f.ts)<14*864e5).map(f=>f.text).join(", ")||"none"}
Recent notes: ${(bp.logs||[]).slice(0,3).map(l=>l.note).join(" | ")||"none yet"}
Last seen: ${ago(bp.logs?.[0]?.ts)} — Bond: ${bp.b}/100`,800);
      br=pj(txt)||br;

        ${esc(raw2.name)}
      </button>
      <span class="nav-title">Briefing</span>
    </div>
    <div style="padding:20px 24px 16px;display:flex;align-items:center;gap:14px" class="a">

      <div style="flex:1">
        <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;letter-spacing:-.3px">${esc(raw2.name)}</div>

      </div>
      <div style="font-size:11px;font-weight:600;color:var(--v);background:var(--v-bg);padding:4px 10px;border-radius:var(--r-pill);letter-spacing:.2px;border:1px solid var(--v-mid)">Ready</div>
    </div>`;
    if(br.opening)h+=`<div class="brief-open a a1">

      <div class="brief-open-txt">"${esc(br.opening)}"</div>

      h+=`<div class="slabel a a2">Walk in knowing this</div>
      <div class="cg a a2" style="padding:4px 18px">`;

    S.stack=["home","profile"];this.renderProfile(S.pid);showOnly("s-profile");

  editSetTag(t){
    A._editTag=t;
    document.querySelectorAll("#edit-tgrid .topt").forEach(e=>e.classList.toggle("on",e.textContent===t));
  },

  removeChip(i){A._editDetails.splice(i,1);this._refreshChips()},

  addChip(){
    const inp=$("edit-new-detail");
    if(!inp||!inp.value.trim())return;
    A._editDetails.push(sanitize(inp.value,LIMITS.detail));
    inp.value="";this._refreshChips();
  },

  _refreshChips(){
    const el=$("edit-chips");if(!el)return;
    el.innerHTML=A._editDetails.length
      ?A._editDetails.map((d,i)=>`<button class="chip" style="cursor:pointer;background:var(--v-bg);color:var(--v);border-color:rgba(107,92,231,.2);display:flex;align-items:center;gap:5px" onclick="A.removeChip(${i})">${esc(d)} <span style="font-size:10px;opacity:.5">✕</span></button>`).join("")
      :`<span style="font-size:12px;color:var(--ink4);font-style:italic">No details yet</span>`;
  },

  saveEdit(id){
    const p=DB.all().find(x=>x.id===id);if(!p)return;
    const newName=sanitize($("edit-name")?.value,LIMITS.name)||p.name;
    DB.upsert({...p,name:newName,tag:A._editTag,details:A._editDetails});
    const m=$("edit-modal");if(m)m.remove();
    this.renderProfile(id);
  },

  dismissFollowUp(id,idx){
    const p=DB.all().find(x=>x.id===id);if(!p)return;
    const fus=p.followUps||[];
    if(fus[idx]) fus[idx].done=true;
    DB.upsert({...p,followUps:fus});
    this.renderProfile(id);
  },

  // ── DELETE ────────────────────────────────────────────────────────────────
  deletePerson(id){
    const p=DB.all().find(x=>x.id===id);if(!p)return;
    const existing=$("delete-modal");if(existing)existing.remove();
    const modal=`<div class="overlay" id="delete-modal">
      <div class="sheet">
        <div class="handle"></div>
        <div class="sheet-title" style="color:var(--red)">Remove ${esc(p.name)}?</div>
        <div class="sheet-sub">This will permanently delete their profile and all interaction history.</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-s btn-sm" style="flex:1" onclick="document.getElementById('delete-modal').remove()">Cancel</button>
          <button class="btn btn-sm" style="flex:1;background:var(--red);color:#fff;border:none;font-size:13px;font-weight:600;border-radius:var(--r);padding:12px;cursor:pointer" onclick="A.confirmDelete('${id}')">Remove</button>
        </div>
      </div>
    </div>`;
    $("s-profile").insertAdjacentHTML("beforeend",modal);
  },

  confirmDelete(id){
    DB.del(id);const m=$("delete-modal");if(m)m.remove();this.tab("home");
  },

  // ── YOU ───────────────────────────────────────────────────────────────────
  renderYou(){
    const people=DB.all().map(p=>({...p,b:bond(p)}));
    const tl=people.reduce((a,p)=>a+(p.logs||[]).length,0);
    const top=[...people].sort((a,b)=>(b.logs||[]).length-(a.logs||[]).length)[0];
    H("s-you",`
      <div class="pad-top"></div>
      <div class="ltitle-wrap a"><div class="ltitle"><strong>${ME}</strong><em>.</em></div></div>
      <div class="slabel a a1">Your Stats</div>
      <div class="cg a a1">
        <div class="crow" style="cursor:default">
          <div style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20C4 17 7.58 15 12 15C16.42 15 20 17 20 20"/></svg>
          </div>
          <div style="flex:1"><div class="pname">People in circle</div></div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--v)">${people.length}</div>
        </div>
        <div class="crow" style="cursor:default">
          <div style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"><path d="M12 20H21M16.5 3.5A2.121 2.121 0 0 1 19.5 6.5L7 19L3 20L4 16L16.5 3.5Z"/></svg>
          </div>
          <div style="flex:1"><div class="pname">Interactions logged</div></div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--v)">${tl}</div>
        </div>
        <div class="crow" style="cursor:default">
          <div style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
          <div style="flex:1"><div class="pname">Strong bonds</div></div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--green)">${people.filter(p=>p.b>=65).length}</div>
        </div>
        <div class="crow" style="cursor:default">
          <div style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8V12M12 16H12.01"/></svg>
          </div>
          <div style="flex:1"><div class="pname">Need attention</div></div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:${people.filter(p=>p.b<50).length?"var(--amber)":"var(--green)"}">${people.filter(p=>p.b<50).length}</div>
        </div>
      </div>
      ${top?`
      <div class="slabel a a2">Most logged</div>
      <div class="cg a a2">
        <button class="crow" onclick="A.person('${top.id}')">
          <div class="ava" style="background:${top.color}">${initials(top.name)}</div>
          <div style="flex:1"><div class="pname">${esc(top.name)}</div>
          <div class="pmeta">${tagPill(top.tag)}<span class="ptime">${(top.logs||[]).length} interactions</span></div></div>
          <div class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 18L15 12L9 6"/></svg></div>
        </button>
      </div>`:""}
      <div class="slabel a a3">About</div>
      <div class="cg a a3">
        <div class="crow" style="cursor:default">
          <div style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div style="flex:1"><div class="pname">Private by default</div><div class="ptime" style="font-size:11px;margin-top:2px">All data stays in this browser only</div></div>
        </div>
        <div class="crow" style="cursor:default">
          <div style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round"><path d="M12 2C12 2 8 7 8 12C8 14.21 9.79 16 12 16C14.21 16 16 14.21 16 12C16 7 12 2 12 2Z"/><path d="M12 16V20"/></svg>
          </div>
          <div style="flex:1"><div class="pname">Powered by Claude AI</div><div class="ptime" style="font-size:11px;margin-top:2px">Anthropic claude-sonnet-4</div></div>
        </div>
      </div>
      <div class="ph a a4" style="padding-bottom:40px">
        <button class="btn btn-d btn-sm" onclick="A.clearAllData()">
          Clear all data
        </button>
      </div>
    `);
  },
  clearAllData(){
    if(!confirm("Delete everything? This cannot be undone.")) return;
    localStorage.removeItem("fam4");
    this.tab("home");
  },
};

document.addEventListener("DOMContentLoaded",()=>A.tab("home"));
</script>
</body>
</html>
