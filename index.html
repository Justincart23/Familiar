<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Familiar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f2f7;--card:#fff;--sep:rgba(60,60,67,.18);
  --txt:#000;--txt2:rgba(60,60,67,.75);--txt3:rgba(60,60,67,.55);--txt4:rgba(60,60,67,.28);
  --accent:#5856d6;--accent-bg:rgba(88,86,214,.1);
  --green:#34c759;--orange:#ff9500;--red:#ff3b30;
  --r:16px;--r-btn:14px;
}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center;align-items:center}

/* SHELL */
#shell{
  width:min(390px,100vw);height:min(844px,100vh);
  background:var(--bg);
  border-radius:clamp(0px,calc((100vw - 390px)*-99 + 48px),48px);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
}

/* SCREENS */
#screens{flex:1;overflow:hidden;position:relative;min-height:0}
.screen{
  position:absolute;top:0;left:0;width:100%;height:100%;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  background:var(--bg);
  display:none;
}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}

/* TABBAR */
#tabs{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);
  display:flex;
  padding:10px 0 max(20px,env(safe-area-inset-bottom,0px));
  flex-shrink:0;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;padding:2px 0;
}
.tab-ic{font-size:23px;line-height:1;filter:grayscale(1) opacity(.38);transition:filter .15s,transform .15s}
.tab-lb{font-size:10px;font-weight:600;color:var(--txt3);transition:color .15s;letter-spacing:.1px}
.tab.on .tab-ic{filter:none;transform:scale(1.1)}
.tab.on .tab-lb{color:var(--accent)}

/* NAV */
.nav{
  padding:max(12px,env(safe-area-inset-top,12px)) 16px 10px;
  display:flex;align-items:center;
  background:rgba(242,242,247,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:50;
  min-height:52px;
}
.nav-title{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;font-weight:600;color:var(--txt);
  position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap;
}
.nav-back{
  font-size:16px;color:var(--accent);background:none;border:none;
  cursor:pointer;font-family:'DM Sans',system-ui,sans-serif;
  font-weight:400;padding:4px 0;z-index:1;
  display:flex;align-items:center;gap:2px;
}

/* TYPOGRAPHY */
.ltitle-wrap{padding:4px 20px 20px}
.ltitle{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;line-height:1.1;letter-spacing:-.4px}
.ltitle em{font-style:italic;color:var(--accent)}
.slabel{font-size:12px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;padding:0 20px 8px}

/* CARDS */
.cg{margin:0 16px 20px;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.04)}
.crow{
  display:flex;align-items:center;gap:12px;padding:13px 16px;
  border:none;background:none;width:100%;text-align:left;cursor:pointer;
  transition:background .1s;position:relative;
}
.crow:active{background:rgba(0,0,0,.04)}
.crow+.crow::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.chev{color:var(--txt4);font-size:18px;margin-left:auto;flex-shrink:0}

/* PERSON ROW */
.ava{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#fff;
}
.pname{font-size:16px;font-weight:500;color:var(--txt);letter-spacing:-.1px}
.pmeta{display:flex;align-items:center;gap:7px;margin-top:3px}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.ptime{font-size:12px;color:var(--txt3)}

/* BOND RING */
.ring-wrap{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:-.3px}

/* STATS */
.stats{display:flex;gap:10px;margin:0 16px 20px}
.stat{flex:1;background:var(--card);border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1;letter-spacing:-1px}
.stat-l{font-size:11px;font-weight:500;color:var(--txt3);margin-top:4px;line-height:1.3}

/* ATTENTION */
.attn{
  margin:0 16px 20px;border-radius:var(--r);padding:14px 16px;
  background:rgba(255,149,0,.1);border:1px solid rgba(255,149,0,.22);
  display:flex;align-items:center;gap:12px;cursor:pointer;
}
.attn-title{font-size:15px;font-weight:600;color:var(--txt)}
.attn-sub{font-size:13px;color:var(--txt2);margin-top:2px}

/* PROFILE */
.phero{
  background:var(--card);border-bottom:.5px solid var(--sep);
  padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;
  margin-bottom:24px;
}
.p-ava-lg{
  width:80px;height:80px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:#fff;
}
.pn-lg{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;letter-spacing:-.5px}
.p-actions{display:flex;gap:10px;width:100%}
.p-act{
  flex:1;border:none;border-radius:12px;padding:10px 8px;cursor:pointer;
  background:var(--accent-bg);display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:opacity .15s;
}
.p-act:active{opacity:.7}
.p-act-ic{font-size:22px}
.p-act-lb{font-size:12px;font-weight:600;color:var(--accent)}

/* SCORE BARS */
.sbar-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.sbar-row+.sbar-row{border-top:.5px solid var(--sep)}
.sbar-lbl{font-size:13px;color:var(--txt2);width:76px;flex-shrink:0}
.sbar-track{flex:1;height:5px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px;background:var(--accent)}
.sbar-val{font-size:13px;font-weight:600;color:var(--accent);width:24px;text-align:right;flex-shrink:0}

/* TIMELINE */
.tl-item{display:flex;gap:12px;padding:13px 0;position:relative}
.tl-item+.tl-item::before{content:'';position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-bg);border:2px solid var(--accent);flex-shrink:0;margin-top:5px}
.tl-date{font-size:12px;color:var(--txt3);font-weight:500;margin-bottom:3px}
.tl-note{font-size:14px;color:var(--txt2);line-height:1.55}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:14px 16px}
.chip{background:var(--bg);border-radius:99px;font-size:13px;color:var(--txt2);font-weight:500;padding:6px 13px}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:17px;font-weight:600;border-radius:var(--r-btn);
  padding:16px;width:100%;transition:opacity .15s,transform .1s;
}
.btn:active{opacity:.8;transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.btn-d{background:rgba(255,59,48,.1);color:var(--red)}
.btn-sm{font-size:15px;padding:13px}

/* INPUTS */
.fsec{margin:0 16px 20px}
.flbl{font-size:12px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px;padding:0 4px 7px}
.fbox{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
input.fi,textarea.fi{
  width:100%;padding:14px 16px;border:none;outline:none;
  font-size:16px;font-family:'DM Sans',system-ui,sans-serif;
  color:var(--txt);background:transparent;-webkit-appearance:none;
}
input.fi::placeholder,textarea.fi::placeholder{color:var(--txt4)}
textarea.fi{resize:none;line-height:1.55}

/* TAG SELECTOR */
.tgrid{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.topt{
  padding:7px 16px;border-radius:99px;font-size:14px;font-weight:600;
  border:1.5px solid transparent;cursor:pointer;transition:all .15s;
  background:var(--bg);color:var(--txt2);
}
.topt.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}

/* SMART CAPTURE BOX */
.capture-wrap{
  margin:0 16px 16px;
  background:var(--card);border-radius:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  overflow:hidden;
}
.capture-ta{
  width:100%;padding:18px 18px 8px;border:none;outline:none;
  font-size:16px;line-height:1.6;font-family:'DM Sans',system-ui,sans-serif;
  color:var(--txt);background:transparent;resize:none;
  -webkit-appearance:none;min-height:120px;
}
.capture-ta::placeholder{color:var(--txt4)}
.capture-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px 12px;
}
.capture-hint{font-size:12px;color:var(--txt4);font-style:italic}
.capture-btn{
  background:var(--accent);color:#fff;border:none;cursor:pointer;
  border-radius:12px;padding:10px 20px;
  font-size:15px;font-weight:600;font-family:'DM Sans',system-ui,sans-serif;
  transition:opacity .15s,transform .1s;flex-shrink:0;
}
.capture-btn:active{opacity:.8;transform:scale(.97)}
.capture-btn:disabled{opacity:.3;cursor:not-allowed}

/* EXAMPLES */
.example-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 16px 24px}
.ex-pill{
  background:var(--card);border-radius:99px;padding:8px 14px;
  font-size:13px;color:var(--txt3);cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.06);transition:background .15s;
  border:none;font-family:'DM Sans',system-ui,sans-serif;
}
.ex-pill:active{background:var(--accent-bg);color:var(--accent)}

/* BRIEFING */
.brief-open{margin:0 16px 20px;background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.brief-open-txt{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;font-weight:300;color:var(--txt2);line-height:1.65}
.bbul{display:flex;gap:12px;align-items:flex-start;padding:13px 0}
.bbul+.bbul{border-top:.5px solid var(--sep)}
.bdot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px}
.btxt{font-size:15px;color:var(--txt2);line-height:1.55}
.brief-close{margin:0 16px 32px;background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.22);border-radius:var(--r);padding:16px}
.brief-close-txt{font-size:14px;color:#248a3d;line-height:1.55}

/* MODAL */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;padding:8px 20px 40px;max-height:80%;overflow-y:auto}
.handle{width:36px;height:4px;background:#d1d1d6;border-radius:2px;margin:10px auto 20px}
.sheet-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:6px}
.sheet-sub{font-size:15px;color:var(--txt3);margin-bottom:20px;line-height:1.5}

/* LOADING */
.ldg{display:flex;flex-direction:column;align-items:center;padding:60px 20px;gap:16px}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--accent-bg);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldg-t{font-size:15px;color:var(--txt3);text-align:center;line-height:1.5}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;padding:50px 32px;text-align:center}
.empty-ic{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-t{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:8px}
.empty-s{font-size:15px;color:var(--txt3);line-height:1.55;margin-bottom:24px}

/* UTILS */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.a{animation:up .28s cubic-bezier(.34,1.1,.64,1) both}
.a1{animation-delay:.05s}.a2{animation-delay:.1s}.a3{animation-delay:.15s}.a4{animation-delay:.2s}
.sp{height:32px}.ph{padding:0 16px}
</style>
</head>
<body>
<div id="shell">
  <div id="screens">
    <div class="screen" id="s-home"></div>
    <div class="screen" id="s-capture"></div>
    <div class="screen" id="s-profile"></div>
    <div class="screen" id="s-log"></div>
    <div class="screen" id="s-brief"></div>
    <div class="screen" id="s-you"></div>
  </div>
  <nav id="tabs">
    <button class="tab" id="t-home" onclick="A.tab('home')">
      <span class="tab-ic">🏠</span><span class="tab-lb">Circle</span>
    </button>
    <button class="tab" id="t-capture" onclick="A.tab('capture')">
      <span class="tab-ic">✦</span><span class="tab-lb">Capture</span>
    </button>
    <button class="tab" id="t-you" onclick="A.tab('you')">
      <span class="tab-ic">🫂</span><span class="tab-lb">You</span>
    </button>
  </nav>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const KEY = "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";
const ME = "Justin";
const TAGS = ["Friend","Family","Dating","Network","Work"];
const TAG_S = {
  Friend: {bg:"rgba(88,86,214,.12)",c:"#5856d6"},
  Family: {bg:"rgba(255,45,85,.12)",c:"#ff2d55"},
  Dating:  {bg:"rgba(255,149,0,.12)",c:"#e67800"},
  Network:{bg:"rgba(52,199,89,.12)",c:"#248a3d"},
  Work:   {bg:"rgba(0,122,255,.12)",c:"#007aff"},
};
const COLORS = ["#5856d6","#007aff","#34c759","#ff9500","#ff2d55","#af52de","#00c7be","#ff6b00"];
const SCREENS = ["home","capture","profile","log","brief","you"];

// ── DB ───────────────────────────────────────────────────────────────────────
const DB = {
  all(){ try{ return JSON.parse(localStorage.getItem("fam4")||"[]") }catch{ return [] } },
  save(d){ localStorage.setItem("fam4", JSON.stringify(d)) },
  upsert(p){ const d=this.all(), i=d.findIndex(x=>x.id===p.id); i>=0?d[i]=p:d.push(p); this.save(d) },
  del(id){ this.save(this.all().filter(p=>p.id!==id)) },
};

// ── BOND ─────────────────────────────────────────────────────────────────────
function bond(p){
  const now=Date.now(), logs=p.logs||[], det=p.details||[];
  let rec=0;
  if(logs.length){ const d=(now-logs[0].ts)/864e5; rec=d<=7?30:d<=14?22:d<=30?14:d<=60?6:0 }
  const r90=logs.filter(l=>(now-l.ts)<90*864e5).length;
  const freq=r90>=8?25:r90>=5?18:r90>=3?12:r90>=2?7:r90>=1?3:0;
  const dep=det.length>=10?25:det.length>=7?18:det.length>=4?12:det.length>=2?6:det.length>=1?2:0;
  return Math.min(100, rec+freq+dep+Math.min(20,logs.length*3));
}
const bColor = s => s>=65?"#34c759":s>=45?"#ff9500":"#ff3b30";
const bLabel = s => s>=85?"Strong":s>=65?"Solid":s>=45?"Fading":"Dormant";

function ring(score, sz=44){
  const r=(sz-6)/2, c=2*Math.PI*r, fill=(score/100)*c, col=bColor(score);
  return `<div class="ring-wrap" style="width:${sz}px;height:${sz}px">
    <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="transform:rotate(-90deg)">
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}22" stroke-width="3"/>
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="3"
        stroke-dasharray="${fill} ${c}" stroke-linecap="round"/>
    </svg>
    <div class="ring-label" style="color:${col};font-size:${sz>50?15:11}px">${score}</div>
  </div>`;
}

// ── CLAUDE ───────────────────────────────────────────────────────────────────
async function claude(sys, usr, mt=800){
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":KEY,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:mt,system:sys,messages:[{role:"user",content:usr}]})
  });
  const d = await r.json();
  return d.content?.[0]?.text || "";
}
function pj(t){ try{ return JSON.parse(t.replace(/```json\n?|```/g,"").trim()) }catch{ return null } }

// ── HELPERS ──────────────────────────────────────────────────────────────────
const ago = ts => {
  if(!ts) return "Never";
  const s=(Date.now()-ts)/1000;
  if(s<60) return "Just now";
  if(s<3600) return `${~~(s/60)}m ago`;
  if(s<86400) return `${~~(s/3600)}h ago`;
  if(s<604800) return `${~~(s/86400)}d ago`;
  if(s<2592e3) return `${~~(s/604800)}w ago`;
  return `${~~(s/2592e3)}mo ago`;
};
const tagPill = t => { const s=TAG_S[t]||TAG_S.Friend; return `<span class="pill" style="background:${s.bg};color:${s.c}">${t}</span>` };
const initials = n => n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const $ = id => document.getElementById(id);
const H = (id,h) => { const e=$(id); if(e) e.innerHTML=h };

// ── STATE ────────────────────────────────────────────────────────────────────
const S = { pid:null, stack:[] };

// ── NAVIGATION ───────────────────────────────────────────────────────────────
function showOnly(id){
  SCREENS.forEach(s => {
    const el = $("s-"+s);
    if(el) el.classList.remove("active");
  });
  const el = $(id);
  if(el){ el.classList.add("active"); el.scrollTop=0; }
}

const A = {

  tab(t){
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
    const tb = $("t-"+t); if(tb) tb.classList.add("on");
    S.stack = [t];
    if(t==="home") this.renderHome();
    else if(t==="capture") this.renderCapture();
    else if(t==="you") this.renderYou();
    showOnly("s-"+t);
  },

  // ── HOME ──────────────────────────────────────────────────────────────────
  renderHome(){
    const people = DB.all().map(p=>({...p,b:bond(p)})).sort((a,c)=>c.b-a.b);
    const fading = people.filter(p=>p.b<50);
    const hr = new Date().getHours();
    const greet = hr<5?"Good night":hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";

    let h = `<div style="height:max(8px,env(safe-area-inset-top,0px))"></div>
    <div class="ltitle-wrap a">
      <div class="ltitle">${greet},<br><em>${ME}.</em></div>
    </div>
    <div class="stats a a1">
      <div class="stat">
        <div class="stat-n" style="color:var(--accent)">${people.length}</div>
        <div class="stat-l">In circle</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:var(--accent)">${people.reduce((a,p)=>a+(p.logs||[]).length,0)}</div>
        <div class="stat-l">Interactions</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:${fading.length?"var(--orange)":"var(--green)"}">${fading.length}</div>
        <div class="stat-l">Need attention</div>
      </div>
    </div>`;

    if(fading.length){
      h += `<div class="attn a a2" onclick="A.person('${fading[0].id}')">
        <span style="font-size:26px">⚠️</span>
        <div style="flex:1">
          <div class="attn-title">${fading[0].name} needs a catch-up</div>
          <div class="attn-sub">Last contact ${ago(fading[0].logs?.[0]?.ts)} · Bond ${fading[0].b}</div>
        </div>
        <div class="chev">›</div>
      </div>`;
    }

    if(!people.length){
      h += `<div class="empty a a2">
        <div class="empty-ic">◎</div>
        <div class="empty-t">Your circle is empty</div>
        <div class="empty-s">Tap Capture and tell Familiar about someone you just talked to.</div>
        <button class="btn btn-p btn-sm" style="max-width:180px" onclick="A.tab('capture')">Get started</button>
      </div>`;
    } else {
      h += `<div class="slabel a a2">Your Circle</div>
      <div class="cg a a3">`;
      people.forEach(p => {
        h += `<button class="crow" onclick="A.person('${p.id}')">
          <div class="ava" style="background:${p.color}">${initials(p.name)}</div>
          <div style="flex:1;min-width:0">
            <div class="pname">${p.name}</div>
            <div class="pmeta">${tagPill(p.tag)}<span class="ptime">${ago(p.logs?.[0]?.ts)}</span></div>
          </div>
          ${ring(p.b, 44)}
          <div class="chev">›</div>
        </button>`;
      });
      h += `</div>`;
    }
    h += `<div class="sp"></div>`;
    H("s-home", h);
  },

  // ── SMART CAPTURE ─────────────────────────────────────────────────────────
  renderCapture(){
    const people = DB.all();
    const examples = [
      "Had coffee with Emma, she just got promoted at Deloitte",
      "Caught up with my mate Jake, his partner just had a baby",
      "Met David at the conference — works at McKinsey, into sailing",
      "Dinner with Priya, she's moving to Brisbane in March",
    ];
    H("s-capture", `
      <div style="height:max(8px,env(safe-area-inset-top,0px))"></div>
      <div class="ltitle-wrap a">
        <div class="ltitle" style="font-size:30px">What just<br><em>happened?</em></div>
      </div>

      <div class="capture-wrap a a1">
        <textarea class="capture-ta" id="cap-ta" placeholder="Just tell me… who did you see, what did you talk about, anything worth remembering." rows="5"></textarea>
        <div class="capture-footer">
          <span class="capture-hint" id="cap-hint">New person or someone in your circle</span>
          <button class="capture-btn" id="cap-btn" disabled onclick="A.submitCapture()">Go →</button>
        </div>
      </div>

      <div class="slabel a a2">Try saying…</div>
      <div class="example-pills a a2">
        ${examples.map(e=>`<button class="ex-pill" onclick="A.fillExample(this)">${e}</button>`).join("")}
      </div>

      ${people.length ? `
      <div class="slabel a a3">Or log for someone</div>
      <div class="cg a a3">
        ${people.slice(0,5).map(p=>`
          <button class="crow" onclick="A.openLog('${p.id}')">
            <div class="ava" style="background:${p.color};width:36px;height:36px;font-size:14px">${initials(p.name)}</div>
            <div style="flex:1"><div class="pname" style="font-size:15px">${p.name}</div></div>
            <span style="font-size:13px;color:var(--accent);font-weight:600">Log ›</span>
          </button>`).join("")}
      </div>` : ""}

      <div class="sp"></div>
    `);

    const ta = $("cap-ta"), btn = $("cap-btn"), hint = $("cap-hint");
    if(ta){
      ta.addEventListener("input", () => {
        btn.disabled = !ta.value.trim();
        if(ta.value.trim()){
          // fuzzy match against existing people
          const txt = ta.value.toLowerCase();
          const match = DB.all().find(p => txt.includes(p.name.toLowerCase().split(" ")[0]));
          hint.textContent = match ? `Looks like ${match.name} — will log as interaction` : "Looks new — will create a profile";
          hint.style.color = match ? "var(--green)" : "var(--accent)";
        } else {
          hint.textContent = "New person or someone in your circle";
          hint.style.color = "";
        }
      });
      setTimeout(()=>ta.focus(), 80);
    }
  },

  fillExample(btn){
    const ta = $("cap-ta");
    if(!ta) return;
    ta.value = btn.textContent;
    ta.dispatchEvent(new Event("input"));
    ta.focus();
  },

  async submitCapture(){
    const note = $("cap-ta")?.value?.trim();
    if(!note) return;

    // Show loading
    H("s-capture", `
      <div class="nav">
        <span class="nav-title">Processing…</span>
      </div>
      <div class="ldg">
        <div class="spin"></div>
        <div class="ldg-t">Familiar is reading your note…</div>
      </div>
    `);

    const people = DB.all();
    const namesList = people.map(p=>p.name).join(", ") || "none";

    let result = null;
    try {
      const txt = await claude(
        `You are Familiar, a relationship memory AI for ${ME}.
Analyse a note and decide: is this about an EXISTING person in ${ME}'s circle, or a NEW person?

Existing people in circle: ${namesList}

If it matches an existing person (fuzzy name match is fine), return:
{"action":"log","personName":"exact name from list","note":"the full note","newDetails":["any new detail"],"summary":"one sentence","followUps":["follow up"]}

If it's a new person, return:
{"action":"new","personName":"their name","tag":"Friend|Family|Dating|Network|Work","details":["specific detail 1","specific detail 2"],"note":"the full note","summary":"one sentence"}

Return ONLY valid JSON. Tag must be one of: Friend, Family, Dating, Network, Work.`,
        `Note: "${note}"`, 600
      );
      result = pj(txt);
    } catch(e) {}

    if(!result){ this.tab("capture"); return; }

    if(result.action === "log"){
      // Log interaction to existing person
      const p = people.find(x=>x.name.toLowerCase()===result.personName?.toLowerCase()) || people.find(x=>x.name.toLowerCase().includes(result.personName?.toLowerCase().split(" ")[0]));
      if(!p){ await this.createNewPerson(result, note); return; }
      const updated = {
        ...p,
        logs:[{note, ts:Date.now()}, ...(p.logs||[])],
        details:[...new Set([...(p.details||[]), ...(result.newDetails||[])])],
      };
      DB.upsert(updated);
      this.showCaptureResult("interaction", p.name, result, p.id);

    } else {
      // Create new person
      await this.createNewPerson(result, note);
    }
  },

  async createNewPerson(result, note){
    const color = COLORS[DB.all().length % COLORS.length];
    const np = {
      id: Date.now()+"",
      name: result.personName || "Unknown",
      tag: result.tag || "Friend",
      color,
      details: result.details || [],
      logs: [{note, ts:Date.now()}],
    };
    DB.upsert(np);
    this.showCaptureResult("new", np.name, result, np.id);
  },

  showCaptureResult(type, name, result, pid){
    const isNew = type === "new";
    const p = DB.all().find(x=>x.id===pid);
    const modal = `
      <div class="overlay" id="cap-modal">
        <div class="sheet">
          <div class="handle"></div>
          <div class="sheet-title">${isNew ? "✅ Added to circle" : "✅ Interaction logged"}</div>
          <div class="sheet-sub">${result.summary || (isNew ? `${name} has been added.` : `Logged for ${name}.`)}</div>

          ${isNew && result.details?.length ? `
            <div class="slabel" style="padding:0 0 8px">What Familiar extracted</div>
            <div class="cg" style="margin:0 0 16px">
              ${result.details.map(d=>`
                <div style="display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:.5px solid var(--sep)">
                  <span style="color:var(--accent);font-weight:700;font-size:16px">+</span>
                  <span style="font-size:14px;color:var(--txt2)">${d}</span>
                </div>`).join("")}
            </div>` : ""}

          ${!isNew && result.newDetails?.length ? `
            <div class="slabel" style="padding:0 0 8px">New details noted</div>
            <div class="cg" style="margin:0 0 16px">
              ${result.newDetails.map(d=>`
                <div style="display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:.5px solid var(--sep)">
                  <span style="color:var(--accent);font-weight:700;font-size:16px">+</span>
                  <span style="font-size:14px;color:var(--txt2)">${d}</span>
                </div>`).join("")}
            </div>` : ""}

          <div style="display:flex;gap:10px">
            <button class="btn btn-s btn-sm" style="flex:1" onclick="A.afterCapture()">Done</button>
            <button class="btn btn-p btn-sm" style="flex:1" onclick="A.goToProfile('${pid}')">View profile</button>
          </div>
        </div>
      </div>`;

    // Re-render capture screen first, then add modal
    this.renderCapture();
    $("s-capture").insertAdjacentHTML("beforeend", modal);
  },

  afterCapture(){
    const m = $("cap-modal"); if(m) m.remove();
    this.tab("home");
  },

  goToProfile(id){
    const m = $("cap-modal"); if(m) m.remove();
    this.person(id);
  },

  // ── PROFILE ───────────────────────────────────────────────────────────────
  person(id){
    S.pid = id;
    this.renderProfile(id);
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
    S.stack = ["home","profile"];
    showOnly("s-profile");
  },

  renderProfile(id){
    const raw = DB.all().find(p=>p.id===id);
    if(!raw){ this.tab("home"); return; }
    const p = {...raw, b:bond(raw)};
    const sc = [
      {l:"Recency",   v: p.b>65?24:p.b>45?16:6},
      {l:"Frequency", v: Math.min(25, ~~((p.logs||[]).filter(l=>(Date.now()-l.ts)<90*864e5).length*3.1))},
      {l:"Depth",     v: Math.min(25, ~~((p.details||[]).length*2.5))},
      {l:"Activity",  v: Math.min(20, (p.logs||[]).length*3)},
    ];

    let h = `<div class="nav a">
      <button class="nav-back" onclick="A.tab('home')">‹ Circle</button>
      <span class="nav-title">${p.name}</span>
      <button style="font-size:15px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:'DM Sans',system-ui,sans-serif;font-weight:500;z-index:1;margin-left:auto" onclick="A.openEdit('${id}')">Edit</button>
    </div>
    <div class="phero a">
      <div class="p-ava-lg" style="background:${p.color}">${initials(p.name)}</div>
      <div style="text-align:center">
        <div class="pn-lg">${p.name}</div>
        <div style="margin-top:5px">${tagPill(p.tag)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        ${ring(p.b, 64)}
        <div>
          <div style="font-size:22px;font-weight:700;color:${bColor(p.b)};letter-spacing:-.3px">${bLabel(p.b)}</div>
          <div style="font-size:13px;color:var(--txt3)">Bond ${p.b}/100</div>
        </div>
      </div>
      <div class="p-actions">
        <button class="p-act" onclick="A.briefing('${id}')">
          <div class="p-act-ic">✦</div>
          <div class="p-act-lb">Briefing</div>
        </button>
        <button class="p-act" onclick="A.openLog('${id}')">
          <div class="p-act-ic">✎</div>
          <div class="p-act-lb">Log</div>
        </button>
      </div>
    </div>

    <div class="slabel a1">Bond Breakdown</div>
    <div class="cg a1" style="padding:4px 16px">`;
    sc.forEach(r => {
      h += `<div class="sbar-row">
        <span class="sbar-lbl">${r.l}</span>
        <div class="sbar-track"><div class="sbar-fill" style="width:${Math.min(100,(r.v/25)*100)}%"></div></div>
        <span class="sbar-val">${r.v}</span>
      </div>`;
    });
    h += `</div>`;

    if((p.details||[]).length){
      h += `<div class="slabel a2">What Familiar Knows</div>
      <div class="cg a2"><div class="chips">`;
      p.details.forEach(d => { h += `<div class="chip">${d}</div>` });
      h += `</div></div>`;
    }

    h += `<div class="slabel a3">Interaction History</div>`;
    if(!(p.logs||[]).length){
      h += `<div class="cg a3" style="padding:20px;text-align:center">
        <p style="color:var(--txt3);font-size:14px">No interactions yet.</p>
      </div>`;
    } else {
      h += `<div class="cg a3" style="padding:4px 16px">`;
      p.logs.forEach(l => {
        h += `<div class="tl-item">
          <div class="tl-dot"></div>
          <div>
            <div class="tl-date">${ago(l.ts)}</div>
            <div class="tl-note">${l.note}</div>
          </div>
        </div>`;
      });
      h += `</div>`;
    }
    h += `<div class="ph a4" style="padding-bottom:40px;margin-top:4px">
      <button class="btn btn-d btn-sm" onclick="A.deletePerson('${id}')">Remove from circle</button>
    </div>`;
    h += `<div class="sp"></div>`;
    H("s-profile", h);
  },

  // ── EDIT ─────────────────────────────────────────────────────────────────
  openEdit(id){
    const p = DB.all().find(x=>x.id===id);
    if(!p) return;
    const modal = `<div class="overlay" id="edit-modal">
      <div class="sheet" style="padding-bottom:max(40px,env(safe-area-inset-bottom,40px))">
        <div class="handle"></div>
        <div class="sheet-title">Edit ${p.name}</div>

        <div class="fsec" style="margin-bottom:16px">
          <div class="flbl">Name</div>
          <div class="fbox"><input class="fi" id="edit-name" type="text" value="${p.name.replace(/"/g,'&quot;')}" autocomplete="off"></div>
        </div>

        <div class="fsec" style="margin-bottom:16px">
          <div class="flbl">Relationship</div>
          <div class="tgrid" id="edit-tgrid">
            ${["Friend","Family","Dating","Network","Work"].map(t=>`<button class="topt${t===p.tag?" on":""}" onclick="A.editSetTag('${t}')">${t}</button>`).join("")}
          </div>
        </div>

        <div class="fsec" style="margin-bottom:8px">
          <div class="flbl">What Familiar knows <span style="text-transform:none;font-weight:400;font-size:11px;color:var(--txt3)">tap to remove</span></div>
          <div class="fbox">
            <div id="edit-chips" style="display:flex;flex-wrap:wrap;gap:7px;padding:12px 14px;min-height:48px">
              ${(p.details||[]).map((d,i)=>`<button class="chip" style="cursor:pointer;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;gap:5px" onclick="A.removeChip(${i})">${d} <span style="font-size:11px;opacity:.6">✕</span></button>`).join("")}
              ${!(p.details||[]).length ? `<span style="font-size:13px;color:var(--txt4);font-style:italic">No details yet</span>` : ""}
            </div>
            <div style="border-top:.5px solid var(--sep);display:flex;align-items:center">
              <input class="fi" id="edit-new-detail" placeholder="Add a detail…" style="font-size:14px;padding:10px 14px">
              <button onclick="A.addChip()" style="padding:10px 14px;background:none;border:none;cursor:pointer;font-size:20px;color:var(--accent)">+</button>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:20px">
          <button class="btn btn-s btn-sm" style="flex:1" onclick="document.getElementById('edit-modal').remove()">Cancel</button>
          <button class="btn btn-p btn-sm" style="flex:1" onclick="A.saveEdit('${id}')">Save</button>
        </div>
      </div>
    </div>`;
    $("s-profile").insertAdjacentHTML("beforeend", modal);
    // store working copy of details
    A._editDetails = [...(p.details||[])];
    A._editTag = p.tag;
  },

  editSetTag(t){
    A._editTag = t;
    document.querySelectorAll("#edit-tgrid .topt").forEach(e=>e.classList.toggle("on", e.textContent===t));
  },

  removeChip(i){
    A._editDetails.splice(i,1);
    this._refreshChips();
  },

  addChip(){
    const inp = $("edit-new-detail");
    if(!inp||!inp.value.trim()) return;
    A._editDetails.push(inp.value.trim());
    inp.value = "";
    this._refreshChips();
  },

  _refreshChips(){
    const el = $("edit-chips");
    if(!el) return;
    el.innerHTML = A._editDetails.length
      ? A._editDetails.map((d,i)=>`<button class="chip" style="cursor:pointer;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;gap:5px" onclick="A.removeChip(${i})">${d} <span style="font-size:11px;opacity:.6">✕</span></button>`).join("")
      : `<span style="font-size:13px;color:var(--txt4);font-style:italic">No details yet</span>`;
  },

  saveEdit(id){
    const p = DB.all().find(x=>x.id===id);
    if(!p) return;
    const nameEl = $("edit-name");
    const newName = nameEl?.value?.trim() || p.name;
    const updated = { ...p, name:newName, tag:A._editTag, details:A._editDetails };
    DB.upsert(updated);
    const m = $("edit-modal"); if(m) m.remove();
    this.renderProfile(id);
  },

  deletePerson(id){
    const p = DB.all().find(x=>x.id===id);
    if(!p) return;
    // Use in-app sheet instead of confirm() which is blocked in some environments
    const existing = $("delete-modal"); if(existing) existing.remove();
    const modal = `<div class="overlay" id="delete-modal">
      <div class="sheet">
        <div class="handle"></div>
        <div class="sheet-title" style="color:var(--red)">Remove ${p.name}?</div>
        <div class="sheet-sub">This will permanently delete their profile and all interaction history. Cannot be undone.</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-s btn-sm" style="flex:1" onclick="document.getElementById('delete-modal').remove()">Cancel</button>
          <button class="btn btn-sm" style="flex:1;background:var(--red);color:#fff;font-size:15px;font-weight:600;border:none;border-radius:var(--r-btn);padding:13px;cursor:pointer" onclick="A.confirmDelete('${id}')">Remove</button>
        </div>
      </div>
    </div>`;
    $("s-profile").insertAdjacentHTML("beforeend", modal);
  },

  confirmDelete(id){
    DB.del(id);
    const m = $("delete-modal"); if(m) m.remove();
    this.tab("home");
  },

  // ── LOG (text only) ───────────────────────────────────────────────────────
  openLog(id){
    S.pid = id;
    const p = DB.all().find(x=>x.id===id);
    S.stack = ["home","profile","log"];

    H("s-log", `
      <div class="nav">
        <button class="nav-back" onclick="A.backToProfile()">‹ ${p?p.name:"Back"}</button>
        <span class="nav-title">Log</span>
      </div>
      <div style="padding:20px 16px">
        <div class="fsec" style="margin-bottom:6px">
          <div class="flbl">What happened?</div>
          <div class="fbox">
            <textarea class="fi" id="lognote" rows="10"
              placeholder="Write freely — what did you talk about, what did they mention, how did they seem?\n\ne.g. Grabbed coffee. She just got promoted. Her sister Emma is visiting from Sydney next week…"></textarea>
          </div>
        </div>
        <div style="font-size:12px;color:var(--txt3);text-align:right;padding:0 4px 20px" id="log-wc">Start writing…</div>
        <button class="btn btn-p" id="log-sub" disabled onclick="A.submitLog('${id}', document.getElementById('lognote').value)">
          Save interaction
        </button>
      </div>
    `);

    const ta=$("lognote"), wc=$("log-wc"), sb=$("log-sub");
    if(ta){
      ta.addEventListener("input",()=>{
        const w = ta.value.trim().split(/\s+/).filter(Boolean).length;
        wc.textContent = ta.value.trim() ? w+" words" : "Start writing…";
        sb.disabled = !ta.value.trim();
      });
      setTimeout(()=>ta.focus(), 80);
    }
    showOnly("s-log");
  },

  async submitLog(id, note){
    if(!note||!note.trim()) return;
    const p = DB.all().find(x=>x.id===id);
    if(!p) return;

    H("s-log", `
      <div class="nav"><span class="nav-title">Saving…</span></div>
      <div class="ldg">
        <div class="spin"></div>
        <div class="ldg-t">Updating ${p.name}'s profile…</div>
      </div>
    `);

    let res = {newDetails:[],summary:"",followUps:[]};
    try {
      const txt = await claude(
        `Extract info from an interaction note about ${p.name} (${p.tag}) for ${ME}.
Already known: ${(p.details||[]).join(", ")||"nothing yet"}.
Return ONLY valid JSON: {"newDetails":["new specific detail"],"summary":"one sentence","followUps":["follow up item"]}
Only extract genuinely NEW details not already listed.`,
        `"${note.trim()}"`, 500
      );
      res = pj(txt) || res;
    } catch(e) {}

    const updated = {
      ...p,
      logs: [{note:note.trim(), ts:Date.now()}, ...(p.logs||[])],
      details: [...new Set([...(p.details||[]), ...(res.newDetails||[])])],
    };
    DB.upsert(updated);
    this.backToProfile();
    this.renderProfile(id);

    // Show result sheet
    const modal = `<div class="overlay" id="log-modal">
      <div class="sheet">
        <div class="handle"></div>
        <div class="sheet-title">✅ Logged</div>
        <div class="sheet-sub">${res.summary||"Saved."}</div>
        ${res.newDetails?.length ? `
          <div class="slabel" style="padding:0 0 8px">New details extracted</div>
          <div class="cg" style="margin:0 0 16px">
            ${res.newDetails.map(d=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:.5px solid var(--sep)"><span style="color:var(--accent);font-weight:700;font-size:16px">+</span><span style="font-size:14px;color:var(--txt2)">${d}</span></div>`).join("")}
          </div>` : ""}
        ${res.followUps?.length ? `
          <div class="slabel" style="padding:0 0 8px">Follow up on</div>
          <div class="cg" style="margin:0 0 20px">
            ${res.followUps.map(f=>`<div style="font-size:14px;color:var(--txt2);padding:10px 16px;border-top:.5px solid var(--sep)">· ${f}</div>`).join("")}
          </div>` : ""}
        <button class="btn btn-p" onclick="document.getElementById('log-modal').remove()">Done</button>
      </div>
    </div>`;
    $("s-profile").insertAdjacentHTML("beforeend", modal);
  },

  backToProfile(){
    S.stack = S.stack.filter(s=>s!=="log");
    this.renderProfile(S.pid);
    showOnly("s-profile");
  },

  // ── BRIEFING ──────────────────────────────────────────────────────────────
  async briefing(id){
    S.pid = id;
    const p = DB.all().find(x=>x.id===id);
    H("s-brief", `
      <div class="nav a">
        <button class="nav-back" onclick="A.backFromBrief()">‹ ${p?p.name:"Back"}</button>
        <span class="nav-title">Briefing</span>
      </div>
      <div class="ldg">
        <div class="spin"></div>
        <div class="ldg-t">Preparing your briefing for ${p?p.name+"…":"…"}</div>
      </div>
    `);
    S.stack = ["home","profile","brief"];
    showOnly("s-brief");

    const raw = DB.all().find(x=>x.id===id);
    if(!raw){ this.backFromBrief(); return; }
    const bp = {...raw, b:bond(raw)};

    let br = {opening:"",bullets:[],closingNote:""};
    try {
      const txt = await claude(
        `You are Familiar, a private relationship memory AI for ${ME}. Write a warm, specific pre-conversation briefing.
Be PERSONAL and SPECIFIC — use real details. Never be generic.
Return ONLY valid JSON: {"opening":"one warm specific sentence","bullets":["concrete thing to ask or mention","another","another","one thing to be mindful of"],"closingNote":"one warm sentence of advice"}`,
        `About ${bp.name} (${bp.tag}):
Details: ${(bp.details||[]).join(", ")||"none yet"}
Recent notes: ${(bp.logs||[]).slice(0,3).map(l=>l.note).join(" | ")||"none yet"}
Last seen: ${ago(bp.logs?.[0]?.ts)}
Bond: ${bp.b}/100`, 800
      );
      br = pj(txt) || br;
    } catch(e) {}

    const raw2 = DB.all().find(x=>x.id===id); if(!raw2) return;
    let h = `
      <div class="nav a">
        <button class="nav-back" onclick="A.backFromBrief()">‹ ${raw2.name}</button>
        <span class="nav-title">Briefing</span>
      </div>
      <div style="padding:18px 20px 16px;display:flex;align-items:center;gap:12px" class="a">
        <div class="p-ava-lg" style="background:${raw2.color};width:52px;height:52px;font-size:20px">${initials(raw2.name)}</div>
        <div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600">${raw2.name}</div>
          <div style="font-size:13px;color:var(--txt3);margin-top:2px">Last seen ${ago(raw2.logs?.[0]?.ts)}</div>
        </div>
        <div style="margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:4px 11px;border-radius:99px">✦ Ready</div>
      </div>`;

    if(br.opening) h += `<div class="brief-open a a1">
      <div style="font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px">Before you go in</div>
      <div class="brief-open-txt">"${br.opening}"</div>
    </div>`;

    if(br.bullets?.length){
      h += `<div class="slabel a a2">Walk in knowing this</div>
      <div class="cg a a2" style="padding:4px 16px">`;
      br.bullets.forEach(b => { h += `<div class="bbul"><div class="bdot"></div><div class="btxt">${b}</div></div>` });
      h += `</div>`;
    }

    if(br.closingNote) h += `<div class="brief-close a a3"><div class="brief-close-txt">💚 ${br.closingNote}</div></div>`;

    h += `<div class="ph a a4" style="padding-bottom:32px">
      <button class="btn btn-s" onclick="A.openLog('${id}')">Log this interaction after</button>
    </div>`;

    H("s-brief", h);
  },

  backFromBrief(){
    S.stack = ["home","profile"];
    this.renderProfile(S.pid);
    showOnly("s-profile");
  },

  // ── YOU ───────────────────────────────────────────────────────────────────
  renderYou(){
    const people = DB.all().map(p=>({...p,b:bond(p)}));
    const tl = people.reduce((a,p)=>a+(p.logs||[]).length,0);
    const top = [...people].sort((a,b)=>(b.logs||[]).length-(a.logs||[]).length)[0];

    H("s-you", `
      <div style="height:max(8px,env(safe-area-inset-top,0px))"></div>
      <div class="ltitle-wrap a"><div class="ltitle">${ME}<em>.</em></div></div>

      <div class="slabel a a1">Your Stats</div>
      <div class="cg a a1">
        <div class="crow" style="cursor:default"><span style="font-size:22px">◎</span><div style="flex:1"><div class="pname">People in circle</div></div><div style="font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--accent)">${people.length}</div></div>
        <div class="crow" style="cursor:default"><span style="font-size:22px">✎</span><div style="flex:1"><div class="pname">Interactions logged</div></div><div style="font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--accent)">${tl}</div></div>
        <div class="crow" style="cursor:default"><span style="font-size:22px">◈</span><div style="flex:1"><div class="pname">Strong bonds</div></div><div style="font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--green)">${people.filter(p=>p.b>=65).length}</div></div>
        <div class="crow" style="cursor:default"><span style="font-size:22px">⚠️</span><div style="flex:1"><div class="pname">Need attention</div></div><div style="font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:${people.filter(p=>p.b<50).length?"var(--orange)":"var(--green)"}">${people.filter(p=>p.b<50).length}</div></div>
      </div>

      ${top ? `
      <div class="slabel a a2">Most logged</div>
      <div class="cg a a2">
        <button class="crow" onclick="A.person('${top.id}')">
          <div class="ava" style="background:${top.color}">${initials(top.name)}</div>
          <div style="flex:1"><div class="pname">${top.name}</div>
          <div class="pmeta">${tagPill(top.tag)}<span class="ptime">${(top.logs||[]).length} interactions</span></div></div>
          <div class="chev">›</div>
        </button>
      </div>` : ""}

      <div class="slabel a a3">About</div>
      <div class="cg a a3">
        <div class="crow" style="cursor:default"><span style="font-size:20px">🔒</span><div style="flex:1"><div class="pname">Private by default</div><div class="ptime" style="font-size:12px;margin-top:2px">All data stays in this browser only</div></div></div>
        <div class="crow" style="cursor:default"><span style="font-size:20px">✦</span><div style="flex:1"><div class="pname">Powered by Claude AI</div><div class="ptime" style="font-size:12px;margin-top:2px">Anthropic claude-sonnet-4</div></div></div>
      </div>

      <div class="ph a a4" style="padding-bottom:40px">
        <button class="btn btn-d btn-sm" onclick="if(confirm('Delete everything? Cannot be undone.')){localStorage.removeItem('fam4');A.tab('home')}">
          Clear all data
        </button>
      </div>
    `);
  },
};

document.addEventListener("DOMContentLoaded", () => A.tab("home"));
</script>
</body>
</html>
